name: Build Sparrow Player
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SparrowPlayer.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SparrowPlayer.apk --title "Sparrow Player (latest)" --notes "Newest build"
